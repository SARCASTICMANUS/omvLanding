# VAYY | nginx.conf (root)
# Single reverse proxy for the production stack:
#   /             -> admin SPA (vayy-admin container)
#   /api /ws ...  -> Django ASGI (web:8000)
#   /static /media -> backend volumes
# Mounted into the `nginx` service via docker-compose.yaml.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream django {
    server web:8000;
}

upstream admin {
    server admin:80;
}

# =========================
# HTTP -> HTTPS redirect
# =========================
server {
    listen 80;
    listen [::]:80;
    server_name onmyvayy.com www.onmyvayy.com;
    return 301 https://$host$request_uri;
}

# =========================
# HTTPS
# =========================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name onmyvayy.com www.onmyvayy.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    # Backend static / media files
    location /static/ {
        alias /static/;
    }
    location /media/ {
        alias /media/;
    }

    # Health check
    location /healthz/ {
        proxy_pass http://django/healthz/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin (moved from /admin/ to avoid clashing with the admin SPA)
    location /django-admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST API (includes /api/accounts/, /api/transport/, etc.)
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets -> Daphne
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else -> Admin SPA (SPA fallback handled by admin nginx)
    location / {
        proxy_pass http://admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
