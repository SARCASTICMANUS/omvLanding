services:

  # db:
  #   image: postgis/postgis:15-3.3
  #   # platform: linux/arm64
  #   container_name: vayy-db
  #   environment:
  #     POSTGRES_DB: vayy
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management   #rabbitmq:4-management
    container_name: vayy-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: vayy-web
    command: sh /app/entrypoint.sh
    volumes:
      - .:/app
      - /app/.venv/        # <-- Apply the same mask here
      - /app/__pycache__/
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      # db:
      #   condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    container_name: vayy-celery
    command: >
      sh -c "celery -A vayy worker -l info -Q celery,tracking,dispatch &
             python manage.py consume_boarding"
    volumes:
      - .:/app
      - /app/.venv/        # <-- Apply the same mask here
      - /app/__pycache__/
    env_file:
      - .env
    depends_on:
      # db:
      #   condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: vayy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/db
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: vayy-nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      - media_volume:/media

    depends_on:
      - web

  osrm:
    image: osrm/osrm-backend:latest
    container_name: vayy-osrm
    volumes:
      - ./osrm:/data
    ports:
      - "5000:5000"
    command: >
      sh -c "if [ ! -f /data/map.osrm ]; then
               osrm-extract -p /opt/car.lua /data/map.osm.pbf &&
               osrm-partition /data/map.osrm &&
               osrm-customize /data/map.osrm;
             fi &&
             osrm-routed --algorithm mld /data/map.osrm"

volumes:
  postgres_data:
  rabbitmq_data:
  static_volume:
  media_volume:
  redisinsight_data: