# VAYY reverse proxy:
#   /             -> admin SPA (vayy-admin container)
#   /api /ws ...  -> Django ASGI (web:8000)
#   /static /media -> backend volumes

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream django {
    server web:8000;
}

upstream admin {
    server admin:80;
}

# 1. HTTP Server - Redirects all traffic to HTTPS automatically
server {
    listen 80;
    server_name _;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server - Handles the secure traffic using free SSL
server {
    listen 443 ssl;
    http2 on;
    server_name _; # Matches any incoming IP or request
    
    # Path to your free self-signed certificate files inside the container/host
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    
    # Modern secure protocols
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    # Backend static / media files
    location /static/ {
        alias /static/;
    }
    location /media/ {
        alias /media/;
    }

    # Health check
    location /healthz/ {
        proxy_pass http://django/healthz/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /django-admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST API
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets -> Daphne
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else -> Admin SPA
    location / {
        proxy_pass http://admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
