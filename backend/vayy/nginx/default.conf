# VAYY reverse proxy:
#   /             -> admin SPA (vayy-admin container)
#   /api /ws ...  -> Django ASGI (web:8000)
#   /static /media -> backend volumes

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream django {
    server web:8000;
}

upstream admin {
    server admin:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Backend static / media files
    location /static/ {
        alias /static/;
    }
    location /media/ {
        alias /media/;
    }

    # Health check
    location /healthz/ {
        proxy_pass http://django/healthz/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin (moved from /admin/ to avoid clashing with the admin SPA)
    location /django-admin/ {
        proxy_pass http://django/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST API
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets -> Daphne
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else -> Admin SPA (with SPA fallback handled by admin nginx)
    location / {
        proxy_pass http://admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

