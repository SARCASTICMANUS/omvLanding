services:
  web:
    build: .
    ports:
      - "8000:8000"
    networks:
      - vayy_network
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG}
      - DATABASE_URL=${DATABASE_URL}
      - OSRM_URL=${OSRM_URL}
    depends_on:
      - redis
      - osrm

    command: >
      sh -c " python manage.py makemigrations --noinput && python manage.py migrate --noinput && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 8000 vayy.asgi:application "

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vayy_network

  osrm:
    image: osrm/osrm-backend
    container_name: osrm
    platform: linux/amd64
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data:delegated
    networks:
      - vayy_network
    command: >
      /bin/bash -c " if [ ! -f /data/map.osrm ]; then
        echo 'Map data not found. Processing...' &&
        osrm-extract -p /opt/car.lua /data/map.osm.pbf &&
        osrm-partition /data/map.osrm &&
        osrm-customize /data/map.osrm;
      fi && echo 'Starting OSRM...' && osrm-routed --algorithm mld /data/map.osrm "

  celery_worker:
    build: .
    command: celery -A vayy worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=${DEBUG}
      - DATABASE_URL=${DATABASE_URL}
      - OSRM_URL=${OSRM_URL}
    depends_on:
      - redis
      # - web
    networks:
      - vayy_network

  celery_beat:
    build: .
    command: celery -A vayy beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=${DEBUG}
      - DATABASE_URL=${DATABASE_URL}
      - OSRM_URL=${OSRM_URL}
    depends_on:
      - redis
      # - web
    networks:
      - vayy_network

networks:
  vayy_network:
    driver: bridge

volumes:
  redis_data:
