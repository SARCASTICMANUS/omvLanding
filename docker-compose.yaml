# VAYY | docker-compose.yaml | Status: 🔧 Fixed
# Reason: Added daphne, celery worker, celery beat, and nginx services. 

services:
  db:
    image: postgis/postgis:15-3.3
    platform: linux/amd64 # Fixes PostGIS crashes/bugs on Apple Silicon
    environment:
      POSTGRES_DB: vayy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:delegated
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app:delegated
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - IN_DOCKER=true
      - DATABASE_URL=postgis://postgres:password@db:5432/vayy_db
      - REDIS_URL=redis://redis:6379/0
      - OSRM_URL=http://osrm:5000

  celery_worker:
    build: ./backend
    command: celery -A vayy worker -l info
    volumes:
      - ./backend:/app:delegated
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - IN_DOCKER=true
      - DATABASE_URL=postgis://postgres:password@db:5432/vayy_db
      - REDIS_URL=redis://redis:6379/0

  celery_beat:
    build: ./backend
    command: celery -A vayy beat -l info
    volumes:
      - ./backend:/app:delegated
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - IN_DOCKER=true
      - DATABASE_URL=postgis://postgres:password@db:5432/vayy_db
      - REDIS_URL=redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
