name: vayy

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vayy}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vayy}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vayy}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["sh", "/app/entrypoint.sh"]
    env_file:
      - ./backend/vayy/.env
    expose:
      - "8000"
    volumes:
      - ./backend/vayy:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/vayy/.env
    command: >
      sh -c "celery -A vayy worker --pool=solo -l info -Q celery,tracking,dispatch,matching,notifications &
             python manage.py consume_boarding &
             python manage.py consume_location"
    volumes:
      - ./backend/vayy:/app
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        BASE_PATH: /zxcv/
        VITE_API_URL: /api
    expose:
      - "80"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BASE_PATH: /
        VITE_API_URL: ${VITE_API_URL:-http://localhost}
        VITE_DYNAMIC_ROUTE_CREATION_ENABLED: ${VITE_DYNAMIC_ROUTE_CREATION_ENABLED:-true}
    expose:
      - "80"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped

  osrm-download:
    image: alpine:3.20
    restart: "no"
    environment:
      OSRM_REGION: ${OSRM_REGION:-central-zone}
    volumes:
      - ./backend/vayy/osrm:/data
    command:
      - sh
      - -c
      - |
        REGION="$${OSRM_REGION:-central-zone}"
        mkdir -p "/data/$$REGION"
        if [ ! -f "/data/$$REGION/map.osm.pbf" ]; then
          echo "Downloading OpenStreetMap region: $$REGION"
          if [ "$$REGION" = "india" ]; then
            URL="https://download.geofabrik.de/asia/india-latest.osm.pbf"
          else
            URL="https://download.geofabrik.de/asia/india/$$REGION-latest.osm.pbf"
          fi
          wget -q -O "/data/$$REGION/map.osm.pbf.tmp" "$$URL" &&
            mv "/data/$$REGION/map.osm.pbf.tmp" "/data/$$REGION/map.osm.pbf"
        else
          echo "OSM extract $$REGION already exists"
        fi

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    user: root
    environment:
      OSRM_REGION: ${OSRM_REGION:-central-zone}
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./backend/vayy/osrm:/data
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        REGION="$${OSRM_REGION:-central-zone}"
        mkdir -p "/data/$$REGION"
        if [ ! -f "/data/$$REGION/map.osrm.ready" ]; then
          echo "Preparing map for $$REGION (one-time, may take a while)"
          rm -f "/data/$$REGION"/map.osrm*
          osrm-extract -p /opt/car.lua "/data/$$REGION/map.osm.pbf" &&
            osrm-partition "/data/$$REGION/map.osrm" &&
            osrm-customize "/data/$$REGION/map.osrm" &&
            touch "/data/$$REGION/map.osrm.ready"
        fi
        exec osrm-routed --algorithm mld "/data/$$REGION/map.osrm"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/5000' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  static_volume:
  media_volume: