map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

# --- Port 80: HTTP Server (Local development + Server redirect) ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 100M;

    # Let's Encrypt ACME challenge (production)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect non-local traffic to HTTPS onmyvayy.com
    # Allows http://localhost and http://127.0.0.1 to pass through locally
    if ($host !~* ^(localhost|127\.0\.0\.1)$) {
        return 301 https://onmyvayy.com$request_uri;
    }

    # --- Local Development Fallback Routes ---
    location /static/ { alias /static/; }
    location /media/  { alias /media/; }

    location /healthz/ {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-admin/ {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_body_buffer_size 60m;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location /ws/ {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        set $admin_upstream http://admin:80;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Port 443 Direct IP Redirect ---
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/onmyvayy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onmyvayy.com/privkey.pem;

    return 301 https://onmyvayy.com$request_uri;
}

# --- Port 443 Primary HTTPS Server ---
server {
    listen 443 ssl;
    http2 on;
    server_name onmyvayy.com www.onmyvayy.com;
    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/onmyvayy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onmyvayy.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /static/ { alias /static/; }
    location /media/  { alias /media/; }

    location /healthz/ {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-admin/ {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        set $admin_upstream http://admin:80;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}