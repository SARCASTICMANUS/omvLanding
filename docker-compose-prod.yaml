# VAYY | docker-compose.yaml (root)
# Single production stack: backend (Django/ASGI) + admin SPA + infra.
# Aligned with backend/vayy/docker-compose.yaml - the two files describe the same
# stack so `docker compose up` works from either location.

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: vayy-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vayy}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vayy}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: vayy-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./backend/vayy
    container_name: vayy-web
    command: sh /app/entrypoint.sh
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - ./backend/vayy/.env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery:
    build: ./backend/vayy
    container_name: vayy-celery
    command: >
      sh -c "celery -A vayy worker -l info -Q celery,tracking,dispatch,matching,notifications &
             python manage.py consume_boarding &
             python manage.py consume_location"
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - ./backend/vayy/.env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: vayy-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: vayy-admin
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - web

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BASE_PATH: /omv/
        VITE_API_URL: ${VITE_API_URL:-https://onmyvayy.com}
    container_name: vayy-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - web

  nginx:
    image: nginx:alpine
    container_name: vayy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - static_volume:/static
      - media_volume:/media
    depends_on:
      - web
      - admin
      - frontend

  osrm-download:
    image: alpine:3.20
    restart: "no"
    environment:
      OSRM_REGION: ${OSRM_REGION:-india}
    volumes:
      - ./backend/vayy/osrm:/data
    command:
      - sh
      - -c
      - |
        set -eu
        REGION="$${OSRM_REGION:-india}"
        mkdir -p "/data/$$REGION"
        if [ ! -f "/data/$$REGION/map.osm.pbf" ]; then
          echo "Downloading OpenStreetMap region: $$REGION"
          if [ "$$REGION" = "india" ]; then
            URL="https://download.geofabrik.de/asia/india-latest.osm.pbf"
          else
            URL="https://download.geofabrik.de/asia/india/$$REGION-latest.osm.pbf"
          fi
          wget -q -O "/data/$$REGION/map.osm.pbf.tmp" "$$URL" &&
            mv "/data/$$REGION/map.osm.pbf.tmp" "/data/$$REGION/map.osm.pbf"
        else
          echo "OSM extract $$REGION already exists"
        fi

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    environment:
      OSRM_REGION: ${OSRM_REGION:-india}
    ports:
      - "5000:5000"
    volumes:
      - ./backend/vayy/osrm:/data
      - ./backend/vayy/osrm_profiles/major_roads.lua:/opt/major_roads.lua:ro
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        REGION="$${OSRM_REGION:-india}"
        PROFILE="/opt/major_roads.lua"
        PROFILE_SHA="$$(sha256sum "$$PROFILE" | cut -d ' ' -f 1)"
        GRAPH="/data/$$REGION/major-roads-$$PROFILE_SHA"
        PBF="/data/$$REGION/map.osm.pbf"
        mkdir -p "$$GRAPH"
        if [ "$$(cat "$$GRAPH/profile.sha256" 2>/dev/null || true)" != "$$PROFILE_SHA" ] ||
           [ ! -s "$$GRAPH/map.osrm.mldgr" ] || [ ! -s "$$GRAPH/map.osrm.cell_metrics" ]; then
          [ -s "$$PBF" ] || { echo "ERROR: missing existing OSM extract: $$PBF" >&2; exit 1; }
          echo "Building major-road OSRM graph for $$REGION from existing PBF"
          rm -f "$$GRAPH"/map.osrm* "$$GRAPH/map.osm.pbf" "$$GRAPH/profile.sha256"
          ln -s "../map.osm.pbf" "$$GRAPH/map.osm.pbf"
          osrm-extract -t 2 -p "$$PROFILE" "$$GRAPH/map.osm.pbf"
          osrm-partition -t 1 "$$GRAPH/map.osrm"
          osrm-customize -t 1 "$$GRAPH/map.osrm"
          for suffix in partition cells cell_metrics mldgr; do
            [ -s "$$GRAPH/map.osrm.$$suffix" ] || { echo "ERROR: incomplete custom graph: map.osrm.$$suffix missing" >&2; exit 1; }
          done
          printf '%s\n' "$$PROFILE_SHA" > "$$GRAPH/profile.sha256.tmp"
          mv "$$GRAPH/profile.sha256.tmp" "$$GRAPH/profile.sha256"
        fi
        echo "Serving major-road OSRM graph $$GRAPH profile=$$PROFILE_SHA"
        exec osrm-routed --algorithm mld "$$GRAPH/map.osrm"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/5000' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_etc:
  certbot_www:
