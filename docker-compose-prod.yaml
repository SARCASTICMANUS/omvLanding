# VAYY | docker-compose.yaml (root)
# Single production stack: backend (Django/ASGI) + admin SPA + infra.
# Aligned with backend/vayy/docker-compose.yaml - the two files describe the same
# stack so `docker compose up` works from either location.

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: vayy-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vayy}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vayy}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: vayy-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./backend/vayy
    container_name: vayy-web
    command: sh /app/entrypoint.sh
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - ./backend/vayy/.env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery:
    build: ./backend/vayy
    container_name: vayy-celery
    command: >
      sh -c "celery -A vayy worker -l info -Q celery,tracking,dispatch,matching,notifications &
             python manage.py consume_boarding &
             python manage.py consume_location"
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - ./backend/vayy/.env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: vayy-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: vayy-admin
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - web

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BASE_PATH: /omv/
        VITE_API_URL: ${VITE_API_URL:-https://onmyvayy.com}
    container_name: vayy-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - web

  nginx:
    image: nginx:alpine
    container_name: vayy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - static_volume:/static
      - media_volume:/media
    depends_on:
      - web
      - admin
      - frontend

  osrm-download:
    image: alpine:3.20
    container_name: vayy-osrm-download
    restart: "no"
    volumes:
      - ./backend/vayy/osrm:/data
    command: >
      sh -c "if [ ! -f /data/map.osm.pbf ]; then
               echo 'Downloading central-zone map...';
               wget -q -O /data/map.osm.pbf.tmp https://download.geofabrik.de/asia/india/central-zone-latest.osm.pbf &&
               mv /data/map.osm.pbf.tmp /data/map.osm.pbf &&
               echo 'Map downloaded to /data/map.osm.pbf';
             else
               echo 'map.osm.pbf already present, skipping download';
             fi"

  osrm:
    image: osrm/osrm-backend:latest
    container_name: vayy-osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend/vayy/osrm:/data
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    command: >
      sh -c "if [ ! -f /data/map.osrm ]; then
               echo 'Extracting map (one-time, may take a while)...';
               osrm-extract -p /opt/car.lua /data/map.osm.pbf &&
               osrm-partition /data/map.osrm &&
               osrm-customize /data/map.osrm &&
               echo 'Map extracted.';
             fi &&
             exec osrm-routed --algorithm mld /data/map.osrm"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/5000' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_etc:
  certbot_www: