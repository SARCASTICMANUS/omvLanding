name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint admin
        run: |
          cd admin
          npm ci
          npx eslint .

  admin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # - name: Build frontend
      #   run: |
      #     cd frontend
      #     npm ci
      #     npm run build

      - name: Build admin
        run: |
          cd admin
          npm ci
          npx vite build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # - name: Validate prod compose
      #   run: docker compose -f docker-compose-prod.yaml config

      - name: Build backend image
        run: docker build -t vayy-backend ./backend/vayy

      - name: Build admin image
        run: docker build -t vayy-admin ./admin

  # security-scan:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4

  #     - name: Setup Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"

  #     - name: Audit Python deps
  #       run: |
  #         pip install pip-audit
  #         pip-audit -r backend/vayy/requirements.txt

  #     - name: Audit frontend deps
  #       run: |
  #         cd frontend
  #         npm ci
  #         npm audit --audit-level=high

  #     - name: Audit admin deps
  #       run: |
  #         cd admin
  #         npm ci
  #         npm audit --audit-level=high

  deploy:
    # needs: [lint, admin-build, docker-build, security-scan]
    needs: [lint, admin-build, docker-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Sync prod compose to VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "mkdir -p /home/azureuser/vayy"
          rsync -avz -e "ssh" \
            docker-compose-prod.yaml nginx.prod.conf .dockerignore \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/azureuser/vayy/

      - name: Sync backend to VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "mkdir -p /home/azureuser/vayy/backend/vayy"
          rsync -avz --delete -e "ssh" \
            --exclude ".venv" --exclude "__pycache__" --exclude "*.pyc" \
            --exclude "staticfiles" --exclude ".env" --exclude "osrm" \
            backend/vayy/ \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/azureuser/vayy/backend/vayy/

      - name: Sync admin to VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "mkdir -p /home/azureuser/vayy/admin"
          rsync -avz --delete -e "ssh" \
            --exclude "node_modules" --exclude "dist" \
            admin/ \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/azureuser/vayy/admin/

      - name: Build and restart containers
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'bash -s' << 'EOF'
            set -e
            cd /home/azureuser/vayy
            docker compose -f docker-compose-prod.yaml down --remove-orphans || true
            sudo systemctl stop nginx apache2 httpd caddy 2>/dev/null || true
            for i in $(seq 1 15); do
              if ! sudo ss -tlnp | grep -q ':80 '; then break; fi
              sleep 2
            done
            docker compose -f docker-compose-prod.yaml up -d --build
            docker compose -f docker-compose-prod.yaml exec web python manage.py migrate
            docker compose -f docker-compose-prod.yaml exec web python manage.py collectstatic --noinput
          EOF
