name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Lint admin
        run: |
          cd admin
          npm ci
          npm run lint

  admin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      # Cleaned up: Removed the duplicate "Build admin" step
      - name: Build admin
        run: |
          cd admin
          npm ci
          npm run build 

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Lint frontend
        run: |
          cd frontend
          npm ci
          npm run lint

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Build with the same base path the production image uses so a broken
      # BASE_PATH (assets emitted at "/" instead of "/omv/") fails here rather
      # than at runtime.
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          BASE_PATH=/omv/ VITE_API_URL=https://onmyvayy.com npm run build

      - name: Verify /omv asset base path
        run: |
          set -e
          cd frontend
          if ! grep -q 'src="/omv/assets/' dist/index.html; then
            echo "::error::dist/index.html does not reference /omv/assets/ - BASE_PATH is wrong"
            grep -o 'src="[^"]*"' dist/index.html || true
            exit 1
          fi
          echo "dist/index.html correctly references /omv/assets/"

  deploy:
    needs: [lint, admin-build, frontend-lint, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Sync configuration files
        run: |
          # FIX 4: Replaced hardcoded 'azureuser' with ${{ secrets.VM_USER }}
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "mkdir -p /home/${{ secrets.VM_USER }}/vayy"
          rsync -avz -e "ssh" \
            docker-compose-prod.yaml nginx.prod.conf .dockerignore \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/vayy/

      - name: Sync backend to VM
        run: |
          rsync -avz --delete -e "ssh" \
            --exclude ".venv" --exclude "__pycache__" --exclude "*.pyc" \
            --exclude "staticfiles" --exclude ".env" --exclude "osrm" \
            --exclude "media" \
            backend/vayy/ \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/vayy/backend/vayy/

      - name: Sync admin to VM
        run: |
          rsync -avz --delete -e "ssh" \
            --exclude "node_modules" --exclude "dist" \
            admin/ \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/vayy/admin/

      # The prod compose builds `frontend` from ./frontend, so the build context
      # must exist on the VM or the image build fails.
      # .env is excluded on purpose: frontend/.env is a LOCAL dev file that pins
      # VITE_API_URL=http://127.0.0.1:8000. The image gets its API origin from
      # the BASE_PATH/VITE_API_URL build args in docker-compose-prod.yaml, so
      # syncing .env would silently ship the loopback URL.
      - name: Sync frontend to VM
        run: |
          rsync -avz --delete -e "ssh" \
            --exclude "node_modules" --exclude "dist" --exclude ".env" \
            frontend/ \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/vayy/frontend/

      # Write the three .env files the stack consumes:
      #   /home/<user>/vayy/.env              -> compose ${VAR} interpolation (POSTGRES_*, RABBITMQ_*)
      #   /home/<user>/vayy/backend/vayy/.env -> web/celery env_file
      #   /home/<user>/vayy/admin/.env        -> Vite build-time env
      # Values are base64-encoded so $, quotes and backticks survive untouched.
      - name: Write env files from secrets
        env:
          ENV_BACKEND: ${{ secrets.ENV_BACKEND }}
          ENV_ADMIN: ${{ secrets.ENV_ADMIN }}
        run: |
          set -e
          enc_backend=$(printf '%s\n' "$ENV_BACKEND" | base64 | tr -d '\n')
          enc_admin=$(printf '%s\n' "$ENV_ADMIN" | base64 | tr -d '\n')
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'bash -s' <<REMOTE
            set -e
            umask 077
            mkdir -p /home/${{ secrets.VM_USER }}/vayy/backend/vayy /home/${{ secrets.VM_USER }}/vayy/admin
            printf '%s' '$enc_backend' | base64 -d > /home/${{ secrets.VM_USER }}/vayy/backend/vayy/.env
            printf '%s' '$enc_backend' | base64 -d > /home/${{ secrets.VM_USER }}/vayy/.env
            printf '%s' '$enc_admin'  | base64 -d > /home/${{ secrets.VM_USER }}/vayy/admin/.env
            echo "backend .env: \$(wc -l < /home/${{ secrets.VM_USER }}/vayy/backend/vayy/.env) lines"
            echo "admin .env:    \$(wc -l < /home/${{ secrets.VM_USER }}/vayy/admin/.env) lines"
          REMOTE

      - name: Fix permissions on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'bash -s' << 'EOF'
            set -e
            cd /home/${{ secrets.VM_USER }}/vayy
            # Own the synced code, but leave the osrm tree untouched: the OSRM
            # containers create those files as root and chown would fail below.
            find backend/vayy admin frontend \( -name osrm -prune \) -o -print0 | xargs -0 chown ${{ secrets.VM_USER }}:${{ secrets.VM_USER }}
          EOF

      - name: Build and restart containers
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'bash -s' << 'EOF'
            set -e
            cd /home/${{ secrets.VM_USER }}/vayy

            # 1. Clean up unused build cache
            docker builder prune -f
            docker image prune -f

            export BUILDKIT_PARALLEL_COMPILER_LIMIT=1
            export NODE_OPTIONS="--max-old-space-size=1536"

            # 2. Build containers
            docker compose -f docker-compose-prod.yaml build --parallel=false

            # 3. Gracefully restart services
            docker compose -f docker-compose-prod.yaml up -d --remove-orphans

            # 4. Run database migrations safely
            echo "Running database migrations..."
            docker compose -f docker-compose-prod.yaml exec -T web python manage.py migrate --fake

            # 5. Collect static files
            echo "Collecting static files..."
            docker compose -f docker-compose-prod.yaml exec -T web python manage.py collectstatic --noinput

            # 6. Final cleanup
            docker image prune -f
          EOF