name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint admin
        run: |
          cd admin
          npm ci
          npx eslint .

  admin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # - name: Build frontend
      #   run: |
      #     cd frontend
      #     npm ci
      #     npm run build

      - name: Build admin
        run: |
          cd admin
          npm ci
          npx vite build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          docker system prune -af
          docker builder prune -af
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Build backend image
        run: docker build -t vayy-web ./backend/vayy

      - name: Build admin image
        run: docker build -t vayy-admin ./admin

  # security-scan:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4

  #     - name: Setup Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"

  #     - name: Audit Python deps
  #       run: |
  #         pip install pip-audit
  #         pip-audit -r backend/vayy/requirements.txt

  #     - name: Audit frontend deps
  #       run: |
  #         cd frontend
  #         npm ci
  #         npm audit --audit-level=high

  #     - name: Audit admin deps
  #       run: |
  #         cd admin
  #         npm ci
  #         npm audit --audit-level=high

  deploy:
    # needs: [lint, admin-build, docker-build, security-scan]
    needs: [lint, admin-build, docker-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Sync prod compose to VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "mkdir -p /home/azureuser/vayy"
          rsync -avz -e "ssh" \
            docker-compose-prod.yaml nginx.prod.conf .dockerignore \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/azureuser/vayy/

      - name: Sync backend to VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "mkdir -p /home/azureuser/vayy/backend/vayy && chmod -R 777 /home/azureuser/vayy/backend/vayy 2>/dev/null || true"
          rsync -avz --delete -e "ssh" \
            --exclude ".venv" --exclude "__pycache__" --exclude "*.pyc" \
            --exclude "staticfiles" --exclude ".env" --exclude "osrm" \
            backend/vayy/ \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/azureuser/vayy/backend/vayy/

      - name: Sync admin to VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "mkdir -p /home/azureuser/vayy/admin && chmod -R 777 /home/azureuser/vayy/admin 2>/dev/null || true"
          rsync -avz --delete -e "ssh" \
            --exclude "node_modules" --exclude "dist" \
            admin/ \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/azureuser/vayy/admin/

      - name: Build and restart containers
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'bash -s' << 'EOF'
            set -e
            cd /home/azureuser/vayy

            # 1. Clean up unused cache to free up RAM/disk
            docker builder prune -f
            docker image prune -f

            # 2. Prevent BuildKit & Vite parallel build spikes
            export BUILDKIT_PARALLEL_COMPILER_LIMIT=1
            export NODE_OPTIONS="--max-old-space-size=1536"

            # 3. Build containers without stopping the live site
            docker compose -f docker-compose-prod.yaml build --parallel=false

            # 4. Gracefully restart services
            docker compose -f docker-compose-prod.yaml up -d --remove-orphans

            # 5. Run migrations with OOM cap (512M) & automatic fallback for schema drift
            echo "Running database migrations..."
            docker compose -f docker-compose-prod.yaml exec -T --memory="512m" web python manage.py migrate || {
              echo "Migration failed. Attempting initial fake migration for existing columns/tables..."
              docker compose -f docker-compose-prod.yaml exec -T --memory="512m" web python manage.py migrate --fake-initial
            }

            # 6. Run static collection with OOM cap
            echo "Collecting static files..."
            docker compose -f docker-compose-prod.yaml exec -T --memory="512m" web python manage.py collectstatic --noinput

            # 7. Post-deploy cleanup
            docker image prune -f
          EOF