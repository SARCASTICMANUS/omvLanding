# Static file server for the VAYY Admin SPA (Vite React build).
# All API / WS traffic is proxied by the main nginx (backend/vayy/nginx), not here.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # SPA fallback: serve index.html for client-side routes (e.g. /admin)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}