server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml image/webp application/wasm;

    # Preload Brotli fallback (nginx-alpine may not have brotli module, gzip is the safety net)

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets with content-hash: immutable cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebP images should be served with proper MIME type
    location ~* \.webp$ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # HTML should not be cached (SPA shell changes on deploy)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}