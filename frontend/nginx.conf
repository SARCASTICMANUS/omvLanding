# VAYY | frontend/nginx.conf
# Serves the built Vite SPA from the "omv" subdirectory.
# The root nginx (../nginx.conf / ../nginx.prod.conf) proxies /omv/ here with
# the full original path preserved, so all locations below are /omv-prefixed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml image/webp image/wasm;

    # /omv -> /omv/ (so relative asset URLs resolve correctly)
    location = /omv {
        return 301 /omv/;
    }

    # SPA fallback
    location /omv/ {
        try_files $uri $uri/ /omv/index.html;
    }

    # Static assets with content-hash: immutable cache.
    # ^~ so these prefix locations win over the regex blocks below, which nginx
    # would otherwise evaluate first and silently drop these headers.
    location ^~ /omv/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public assets (service worker, icons, fonts, 3D models)
    location ^~ /omv/sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /omv/models/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /omv/fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # WebP images should be served with proper MIME type
    location ~* \.webp$ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # HTML should not be cached (SPA shell changes on deploy)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Do not advertise this container as the SPA root: only /omv/ is served.
    location / {
        return 404;
    }
}
