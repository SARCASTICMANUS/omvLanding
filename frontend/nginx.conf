# VAYY | frontend/nginx.conf
# Serves the built Vite SPA from the document ROOT.
# BASE_PATH=/ (see ../frontend/Dockerfile) emits every asset URL at /assets/...,
# so all locations below are root-prefixed.
#
# NOTE: in the omv-backend stack this file is NOT the one in effect — the
# compose service mounts ../omv-backend/nginx.frontend.conf over it, because
# that file also reverse-proxies /api/, /ws/, /zxcv/ and /django-admin/.
# This file keeps the image self-consistent for standalone runs.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml image/webp image/wasm;

    # KYC document uploads are multipart POSTs through /api/; this file has no
    # /api/ proxy, but keep the ceiling in case one is added.
    client_max_body_size 100M;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets with content-hash: immutable cache.
    # ^~ so these prefix locations win over the regex blocks below, which nginx
    # would otherwise evaluate first and silently drop these headers.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public assets (service worker, icons, fonts, 3D models)
    location ^~ /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /models/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # WebP images should be served with proper MIME type
    location ~* \.webp$ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # HTML should not be cached (SPA shell changes on deploy)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
